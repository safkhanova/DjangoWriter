<section id="{{ section.slug }}" class="page-section theme-{{ section.theme }}{% if not section.is_visible %} is-hidden-preview{% endif %}">
  <div class="container">
    {% include "site/partials/section_head.html" %}
    {% if articles %}
    <div class="card-grid">
      {% for article in articles %}{% include "site/partials/article_card.html" %}{% endfor %}
    </div>
    {% else %}{% include "site/partials/empty.html" %}{% endif %}
  </div>
</section>
